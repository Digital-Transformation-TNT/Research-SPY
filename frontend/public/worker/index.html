<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Research-SPY · Máy thợ crawl</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif; background:#0d1117; color:#e7ecf3; padding:28px; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:#8b98a9; margin:0 0 22px; }
  .card { background:#161b22; border:1px solid #253040; border-radius:12px; padding:16px 18px; max-width:720px; margin:0 0 14px; }
  .row { display:flex; align-items:center; gap:10px; margin:6px 0; }
  .dot { width:10px; height:10px; border-radius:50%; background:#555; flex:none; }
  .dot.on { background:#3fb950; box-shadow:0 0 8px #3fb95088; }
  .dot.off { background:#f85149; }
  .k { color:#8b98a9; width:150px; flex:none; }
  .v { font-weight:600; }
  .big { font-size:26px; font-weight:700; }
  #log { max-width:720px; background:#0b0f14; border:1px solid #253040; border-radius:12px; padding:12px 14px; height:280px; overflow:auto; font:12px/1.5 ui-monospace,Consolas,monospace; white-space:pre-wrap; color:#c9d4e0; }
  .warn { color:#e3b341; }
  .err { color:#f85149; }
  .ok { color:#3fb950; }
</style>
</head>
<body>
  <h1>🛠️ Research-SPY — Máy thợ crawl</h1>
  <p class="sub">Trang này biến trình duyệt (đã cài extension + đăng nhập sàn) thành máy crawl chung. Giữ tab MỞ.</p>

  <div class="card">
    <div class="row"><span class="dot" id="extDot"></span><span class="k">Extension</span><span class="v" id="extState">đang kiểm…</span></div>
    <div class="row"><span class="dot" id="netDot"></span><span class="k">Kết nối server</span><span class="v" id="netState">—</span></div>
    <div class="row"><span class="k">Đã xử lý</span><span class="v big" id="done">0</span></div>
    <div class="row"><span class="k">Job gần nhất</span><span class="v" id="last">—</span></div>
  </div>

  <div id="log"></div>

<script>
/* Cầu postMessage tới extension — GIỮ NGUYÊN giao thức của research.js (CALL/CALL_RESULT). */
const RS_PAGE = 'research-spy', RS_EXT = 'research-spy-ext';
let _seq = 0;

/* HẠN GIỜ THEO TỪNG LOẠI JOB, không phải một con số chung.
 *
 * Bốn mươi giây là đủ cho một lệnh crawl sàn, nhưng KHÔNG đủ cho ba loại job dài — và khi
 * hụt, hỏng theo kiểu tệ nhất: trang bỏ cuộc, POST `result: null` về, còn extension vẫn chạy
 * tiếp tới lúc xong rồi trả kết quả vào hư không. Backend đọc `null` thành "extension chưa
 * nạp loại job này", tức là một câu chẩn đoán SAI HẲN so với nguyên nhân thật.
 *
 * Mỗi con số dưới đây phải LỚN HƠN ngân sách của chính handler bên `background.js`, và NHỎ
 * HƠN hạn của backend cho cùng loại job (`SUBMIT_TIMEOUTS` ở `lib/core/worker_relay.py`) —
 * thứ tự ấy giữ cho bên bỏ cuộc trước luôn là bên biết vì sao mình bỏ cuộc.
 *
 * THIẾU MỘT DÒNG Ở BẢNG NÀY LÀ HỎNG IM LẶNG, và đã hỏng đúng như vậy với hai nguồn VIDEO:
 * `RS_TIKTOK` và `RS_DOUYIN` không có tên ở đây nên rơi về 40 giây mặc định, trong khi
 * `searchTiktok`/`searchDouyin` bên `background.js` đều có ngân sách 120 giây. Trang bỏ cuộc ở
 * giây 40, POST `result: null` về, và cửa sổ video hiện "Không có video" — không phân biệt
 * được với việc thật sự không có video nào. Thêm nguồn dài mới thì thêm dòng ở đây TRƯỚC.
 */
const JOB_TIMEOUT_MS = {
  RS_SHOPEE: 40000,         // extension chờ 22s + mở tab + điều hướng; trần 28s từng bị chạm
                            // dù extension chưa vượt 22s. Chuỗi đúng: 22s < 40s < 45s.
  RS_TEMU_SUGGEST: 80000,   // gõ tối đa 12 cụm vào ô tìm kiếm Temu, ngân sách extension 75s
  RS_LENS_IMAGE: 88000,     // mở google.com, thả ảnh, chờ trang kết quả, cuộn cho ảnh kịp tải
  RS_TAOBAO_IMAGE: 88000,   // mở taobao.com, bấm nút máy ảnh, thả ảnh, chờ tab kết quả
  RS_FB_ADLIB: 80000,       // mở tab Ad Library, chờ trang bắn query + cuộn lấy vài trang (deadline 45s + mở tab)
  RS_TRENDS_RELATED: 110000, // đi tối đa HAI trang: Khám phá mới (30s cuộn) rồi mới rơi về trang cũ (20s), cộng hai lần tải
  RS_TIKTOK: 140000,        // totalDeadline 120s cho cả loạt cụm, cộng mở tab + focus + gom kết quả
  RS_DOUYIN: 140000,        // như TikTok, và Douyin còn hay chen màn xác minh 滑块 giữa chừng
  RS_GOOGLE_VIDEOS: 50000,  // một lần tải trang google + một lượt cuộn, không đăng nhập gì cả
};

function rsCall(msg, timeoutMs = 40000) {
  return new Promise((resolve) => {
    const id = `wk-${Date.now()}-${_seq++}`;
    const timer = setTimeout(() => { window.removeEventListener('message', onMsg); resolve({ __timeout: true }); }, timeoutMs);
    function onMsg(e) {
      if (e.source !== window) return;
      const d = e.data;
      if (!d || d.source !== RS_EXT || d.id !== id) return;
      clearTimeout(timer); window.removeEventListener('message', onMsg); resolve(d.result);
    }
    window.addEventListener('message', onMsg);
    window.postMessage({ source: RS_PAGE, type: 'CALL', id, msg }, '*');
  });
}
async function ping() {
  const id = `wk-ping-${_seq++}`;
  return await new Promise((resolve) => {
    const timer = setTimeout(() => { window.removeEventListener('message', onMsg); resolve(false); }, 2500);
    function onMsg(e) {
      if (e.source !== window) return; const d = e.data;
      if (d && d.source === RS_EXT && d.type === 'PONG') { clearTimeout(timer); window.removeEventListener('message', onMsg); resolve(!!d.ok); }
    }
    window.addEventListener('message', onMsg);
    window.postMessage({ source: RS_PAGE, type: 'PING', id }, '*');
  });
}

const $ = (id) => document.getElementById(id);
let done = 0;
function log(msg, cls = '') {
  const el = $('log'); const t = new Date().toLocaleTimeString();
  el.innerHTML += `<div class="${cls}">[${t}] ${msg}</div>`; el.scrollTop = el.scrollHeight;
}
function setExt(ok) { $('extDot').className = 'dot ' + (ok ? 'on' : 'off'); $('extState').textContent = ok ? 'đã sẵn sàng' : 'CHƯA THẤY — cài extension + tải lại trang'; }
function setNet(ok, txt) { $('netDot').className = 'dot ' + (ok ? 'on' : 'off'); $('netState').textContent = txt; }

async function loop() {
  // 1) Chờ extension
  let hasExt = await ping();
  setExt(hasExt);
  while (!hasExt) { log('Chưa thấy extension. Cài ở chrome://extensions rồi F5 trang này.', 'warn'); await new Promise(r => setTimeout(r, 3000)); hasExt = await ping(); setExt(hasExt); }
  log('Extension OK — bắt đầu nhận job.', 'ok');

  // Token máy-thợ (TÙY CHỌN): nếu backend đặt RELAY_WORKER_TOKEN, dán cùng chuỗi vào
  // localStorage.wk_token (DevTools > Console: `localStorage.wk_token='...'` rồi F5). Không đặt
  // thì để trống, khớp backend mở /next+/result như cũ.
  const wkHeaders = (base) => {
    const t = localStorage.getItem('wk_token');
    return t ? { ...(base || {}), 'x-worker-token': t } : (base || {});
  };

  // 2) Vòng long-poll
  while (true) {
    let job = null;
    try {
      const r = await fetch('/api/relay/next', { cache: 'no-store', headers: wkHeaders() });
      // Backend đang khởi động lại → proxy của Next trả text "Internal Server Error", KHÔNG phải
      // JSON. Xử êm (chờ rồi poll lại) thay vì ném SyntaxError đáng sợ mỗi lần restart.
      if (!r.ok) { setNet(false, 'server tạm nghỉ — thử lại'); await new Promise(r => setTimeout(r, 2000)); continue; }
      let j;
      try { j = await r.json(); }
      catch { setNet(false, 'server đang khởi động lại — chờ'); await new Promise(r => setTimeout(r, 2000)); continue; }
      setNet(true, 'online');
      if (j.empty) continue;      // hết giờ chờ → poll lại
      job = j;
    } catch (e) {
      // Mất mạng thật (Failed to fetch) — không log rác mỗi nhịp, chỉ đổi trạng thái rồi thử lại.
      setNet(false, 'mất kết nối — thử lại');
      await new Promise(r => setTimeout(r, 2000)); continue;
    }

    log(`Nhận job ${job.id} · ${job.type} · ${JSON.stringify(job.payload).slice(0,80)}`);
    let result = null;
    try {
      const budget = JOB_TIMEOUT_MS[job.type] || 40000;
      result = await rsCall({ type: job.type, ...job.payload }, budget);
      // KHÔNG trả `null` ở đây. `null` đã có sẵn một nghĩa mà nửa tầng `lib` đang dựa vào:
      // "extension chưa nạp loại job này, vào chrome://extensions bấm Reload". Trang này hết
      // giờ chờ extension là chuyện khác hẳn, và trả nhầm `null` là đẩy người đi sửa sai chỗ.
      // Cờ `__workerError` giữ hai chuyện tách nhau; `blocked`+`error` để cửa sổ video hiện
      // đúng lý do thay vì "không có video".
      if (result && result.__timeout) {
        const why = `Máy-thợ chạy ${job.type} quá ${Math.round(budget / 1000)}s mà extension chưa trả lời.`;
        log('  extension không trả lời (timeout).', 'err');
        result = { __workerError: true, ok: false, blocked: true, error: why, items: [] };
      }
    } catch (e) {
      log('  lỗi chạy job: ' + e, 'err');
      result = { __workerError: true, ok: false, blocked: true, error: `Máy-thợ lỗi khi chạy ${job.type}: ${e}`, items: [] };
    }

    try {
      await fetch('/api/relay/result', { method: 'POST', headers: wkHeaders({ 'content-type': 'application/json' }), body: JSON.stringify({ id: job.id, result }) });
      done++; $('done').textContent = done; $('last').textContent = `${job.type} · ${new Date().toLocaleTimeString()}`;
      log(`  ✓ trả kết quả job ${job.id}`, result && !result.__workerError ? 'ok' : 'warn');
    } catch (e) { log('  lỗi trả kết quả: ' + e, 'err'); }

    // CẦU NỐI CHẾT THÌ PHẢI NGỪNG NHẬN JOB. Sau khi Reload extension, `chrome.runtime` trong
    // tab này ném "context invalidated", nhưng phần long-poll chỉ dùng `fetch` nên vẫn khoẻ —
    // trang hút sạch hàng đợi rồi trả lỗi cho từng job, và một tab máy-thợ khoẻ ở đâu đó sẽ
    // không bao giờ giành được job nào.
    if (deadBridge(result)) {
      setExt(false);
      const tries = Number(sessionStorage.getItem('wk_reloads') || 0);
      if (tries < 2) {
        sessionStorage.setItem('wk_reloads', String(tries + 1));
        log('Cầu nối tới extension đã chết (vừa Reload extension?). Tự tải lại trang…', 'warn');
        setTimeout(() => location.reload(), 1200);
      } else {
        // Hai lần không ăn thì vấn đề không ở tab này — dừng hẳn, đừng reload vô tận.
        log('Vẫn không nối được extension sau 2 lần tải lại. Kiểm tra extension còn BẬT ở '
            + 'chrome://extensions không, rồi F5 trang này. Đã NGỪNG nhận job để không '
            + 'chiếm job của máy-thợ khác.', 'err');
      }
      return;
    }
  }
}

/** Kết quả này có phải do cầu nối extension đã chết không (khác hẳn job chạy rồi thất bại). */
function deadBridge(result) {
  const err = result && result.error;
  return typeof err === 'string' && /context invalidated|Extension context/i.test(err);
}

loop();
</script>
</body>
</html>
