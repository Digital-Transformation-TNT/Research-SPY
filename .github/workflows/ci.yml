name: CI

# TẤT CẢ job chạy trên self-hosted runner Windows (chính VPS) — KHÔNG dùng ubuntu-latest nữa,
# nên không phụ thuộc quota phút GitHub-hosted (trước đây hết phút → CI treo → auto-deploy đứng).
# Runner đơn chạy tuần tự từng job, hơi chậm hơn nhưng không bao giờ kẹt chờ máy. Lệnh viết theo
# PowerShell (shell mặc định của runner Windows): không dùng '||'/'pipx'; pip đọc requirements
# tiếng Việt cần PYTHONUTF8=1 (đặt ở job backend/security-audit).
#
# Chỉ chạy kiểm tra XÁC ĐỊNH ĐƯỢC — không đụng smoke cần Chrome/Google/mạng ngoài (scripts/smoke/*),
# vì chúng đỏ vì môi trường chứ không phải vì code. Mục tiêu: mỗi lần đỏ là một lỗi thật.

on:
  push:
    # Chỉ Titus: runner đơn self-hosted, khỏi build 2 lần mỗi thay đổi. main là bản mirror
    # (fast-forward từ Titus cho Dependabot soi nhánh mặc định) nên không cần CI riêng.
    branches: [Titus]
  pull_request:
  workflow_dispatch:

# Đẩy commit mới lên cùng nhánh → huỷ lần chạy cũ, khỏi xếp hàng tốn runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · import + compile
    runs-on: [self-hosted, windows]
    # PYTHONUTF8: pip trên Windows đọc requirements.txt bằng codepage hệ thống (cp1252) và chết
    # ở comment tiếng Việt (UTF-8). Ép UTF-8 cho cả job. Vô hại với các bước khác.
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Cài phụ thuộc
        run: pip install -r backend/requirements.txt
      - name: Compile toàn bộ (bắt lỗi cú pháp)
        run: python -m compileall -q backend
      - name: Import cả app (bắt lỗi import-graph, gồm cả router relay/cost)
        working-directory: backend
        run: python -c 'import app.main; print("import app.main OK")'
      - name: Ruff lint (tư vấn — không chặn merge)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check backend

  frontend:
    name: Frontend · typecheck + build
    runs-on: [self-hosted, windows]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Build không gọi backend; đặt sẵn cho chắc, khớp mặc định next.config.mjs.
      BACKEND_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cài phụ thuộc (npm ci — khoá theo lockfile)
        working-directory: frontend
        run: npm ci
      - name: Typecheck (tsc --noEmit)
        working-directory: frontend
        run: npm run typecheck
      - name: Build production
        working-directory: frontend
        run: npm run build

  extension:
    name: Extension · test vòng đời tab
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node extension/tabs.test.js (chrome API giả, không cần Chrome)
        run: node extension/tabs.test.js

  security-audit:
    name: Audit phụ thuộc (tư vấn)
    runs-on: [self-hosted, windows]
    # Không chặn merge: để job này chỉ SOI ra chứ không đỏ-tường. Nâng cấp gói là quyết định riêng.
    continue-on-error: true
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (frontend)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (backend)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

  # ---------------------------------------------------------------------------
  # Auto-deploy vào VPS — CHỈ khi push nhánh Titus VÀ ba job kiểm ở trên xanh.
  # `needs` khiến job này bị bỏ qua nếu backend/frontend/extension đỏ, nên code
  # lỗi không bao giờ ra production. security-audit (tư vấn) KHÔNG nằm trong needs.
  # Chạy trên chính VPS qua self-hosted runner; muốn deploy tay/override nhánh
  # khác thì dùng .github/workflows/deploy.yml (workflow_dispatch).
  # ---------------------------------------------------------------------------
  deploy:
    name: Auto-deploy VPS (push Titus + CI xanh)
    needs: [backend, frontend, extension]
    if: github.event_name == 'push' && github.ref == 'refs/heads/Titus'
    runs-on: [self-hosted, windows]
    environment: production
    # Chung group với deploy.yml → auto-deploy và deploy bấm-tay không chồng nhau;
    # cancel-in-progress:false để một lượt deploy đang chạy không bị lượt sau cắt ngang.
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Redeploy C:\AI-TNT-Research-SPY
        shell: powershell
        run: .\deploy\redeploy.ps1 -Root "C:\AI-TNT-Research-SPY" -Branch "Titus"
