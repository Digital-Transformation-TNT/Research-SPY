name: Deploy to VPS

# Deploy vào VPS production (Windows, 157.66.101.73) — đường BẤM TAY / override.
# Auto-deploy (sau khi CI xanh, push nhánh Titus) NAY nằm ở job `deploy` trong ci.yml.
# File này để: deploy một SHA/nhánh cụ thể, hoặc deploy lại khi không đổi code. Dùng chung
# concurrency group `deploy-vps` với ci.yml nên không bao giờ chạy chồng auto-deploy.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "SHA/branch để deploy (trống = đỉnh nhánh Titus)"
        required: false
        default: ""

# Không bao giờ chạy hai lần deploy chồng nhau.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Kéo code + build + restart service
    # Runner tự-lưu-trữ cài trên chính VPS Windows (xem README). Không cần SSH/secret: job
    # chạy NGAY TRÊN máy đích bằng PowerShell.
    runs-on: [self-hosted, windows]
    # 'production' cho phép bật Required reviewers trong Settings → Environments để duyệt tay.
    environment: production
    steps:
      - name: Checkout (lấy chính script redeploy)
        uses: actions/checkout@v4
      - name: Redeploy C:\ResearchSpy
        shell: powershell
        run: |
          $ref = "${{ github.event.inputs.ref }}"
          .\deploy\redeploy.ps1 -Root "C:\ResearchSpy" -Branch "Titus" -Ref $ref
