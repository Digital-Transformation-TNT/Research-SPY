<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: light dark; }
    body { width: 360px; margin: 0; font: 13px/1.5 system-ui, sans-serif; padding: 14px; }
    h1 { font-size: 14px; margin: 0 0 4px; }
    .sub { color: #777; font-size: 11.5px; margin: 0 0 12px; }
    .row { display: flex; gap: 6px; margin-bottom: 10px; }
    input, select, button { font: inherit; padding: 7px 9px; border: 1px solid #ccc; border-radius: 8px; background: Canvas; color: CanvasText; }
    input { flex: 1; }
    button { cursor: pointer; background: #0f766e; color: #fff; border-color: #0f766e; font-weight: 600; }
    button:disabled { opacity: .55; cursor: default; }
    .status { font-size: 12px; margin: 8px 0; min-height: 16px; }
    .status.err { color: #b3261e; }
    .status.ok { color: #157a41; }
    .list { display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow-y: auto; }
    .item { display: flex; gap: 9px; border: 1px solid #e2e2e2; border-radius: 10px; padding: 8px; }
    .item img { width: 52px; height: 52px; object-fit: cover; border-radius: 7px; background: #eee; flex: none; }
    .item .name { font-size: 12px; line-height: 1.35; max-height: 3.4em; overflow: hidden; }
    .item .meta { font-size: 11.5px; color: #555; margin-top: 3px; }
    .item .price { color: #b45309; font-weight: 700; }
  </style>
</head>
<body>
  <h1>Research-SPY Fetcher</h1>
  <p class="sub">Tự test: lấy sản phẩm Shopee bằng phiên đăng nhập của bạn.</p>
  <div class="row">
    <input id="kw" placeholder="Keyword" />
    <select id="region">
      <option value="VN">VN</option>
      <option value="TH">TH</option>
      <option value="ID">ID</option>
      <option value="MY">MY</option>
      <option value="PH">PH</option>
      <option value="SG">SG</option>
      <option value="TW">TW</option>
      <option value="BR">BR</option>
      <option value="MX">MX</option>
      <option value="CO">CO</option>
      <option value="CL">CL</option>
    </select>
  </div>
  <div class="row">
    <button id="go" style="flex:1">Tìm thử</button>
  </div>
  <div class="row">
    <button id="openResults" style="flex:1; background:#0f766e; border-color:#0f766e;">📊 Mở trang research đầy đủ (ranking + số lượng)</button>
  </div>
  <div class="status" id="status"></div>
  <button id="similar" style="display:none; width:100%; margin-bottom:8px; background:#7c3aed; border-color:#7c3aed;">🔍 Test tìm SP tương tự (SP #1)</button>
  <button id="copy" style="display:none; width:100%; margin-bottom:10px; background:#555; border-color:#555;">📋 Copy JSON mẫu (dán cho dev)</button>
  <pre id="debug" style="display:none; font-size:10.5px; background:#f4f4f4; color:#333; padding:8px; border-radius:8px; white-space:pre-wrap; word-break:break-all; max-height:150px; overflow:auto; margin:0 0 10px;"></pre>
  <div class="list" id="list"></div>
  <script src="popup.js"></script>
</body>
</html>
